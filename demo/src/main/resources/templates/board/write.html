<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글쓰기</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body style="background-color: #f8f9fa;">
<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
    <div class="container">
        <a class="navbar-brand" href="/board">
            <i class="bi bi-chat-dots-fill"></i> 익명 게시판
        </a>
    </div>
</nav>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow">
                <div class="card-header bg-white">
                    <h3 class="mb-0">
                        <i class="bi bi-pencil-square"></i> 글쓰기
                    </h3>
                </div>

                <div class="card-body">
                    <form th:action="@{/board/write}" th:object="${board}" method="post">
                        <div class="mb-3">
                            <label for="title" class="form-label fw-bold">제목</label>
                            <input type="text"
                                   class="form-control"
                                   id="title"
                                   th:field="*{title}"
                                   th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'"
                                   placeholder="제목을 입력하세요">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">
                                제목 오류
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="nickname" class="form-label fw-bold">
                                    닉네임
                                    <small class="text-muted">(익명)</small>
                                </label>
                                <input type="text"
                                       class="form-control"
                                       id="nickname"
                                       th:field="*{nickname}"
                                       th:classappend="${#fields.hasErrors('nickname')} ? 'is-invalid'"
                                       placeholder="닉네임 (예: 익명123)">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}">
                                    닉네임 오류
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label for="password" class="form-label fw-bold">
                                    비밀번호
                                    <small class="text-muted">(수정/삭제용, 4~20자)</small>
                                </label>
                                <input type="password"
                                       class="form-control"
                                       id="password"
                                       th:field="*{password}"
                                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                                       placeholder="비밀번호">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">
                                    비밀번호 오류
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="content" class="form-label fw-bold">내용</label>
                            <textarea class="form-control"
                                      id="content"
                                      th:field="*{content}"
                                      th:classappend="${#fields.hasErrors('content')} ? 'is-invalid'"
                                      rows="15"
                                      placeholder="내용을 입력하세요"></textarea>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('content')}" th:errors="*{content}">
                                내용 오류
                            </div>
                        </div>

                        <div class="alert alert-info">
                            <i class="bi bi-info-circle"></i>
                            <small>
                                익명 게시판입니다. 닉네임과 비밀번호만으로 게시글을 작성할 수 있습니다.
                                작성 시 IP 주소가 일부 마스킹되어 표시됩니다.
                            </small>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/board}" class="btn btn-secondary btn-lg">
                                <i class="bi bi-x-circle"></i> 취소
                            </a>
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-check-circle"></i> 작성완료
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
