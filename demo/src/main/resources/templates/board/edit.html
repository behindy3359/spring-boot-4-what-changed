<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글 수정</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body style="background-color: #f8f9fa;">
<nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
    <div class="container">
        <a class="navbar-brand" href="/board">
            <i class="bi bi-chat-dots-fill"></i> 익명 게시판
        </a>
    </div>
</nav>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow">
                <div class="card-header bg-white">
                    <h3 class="mb-0">
                        <i class="bi bi-pencil"></i> 글 수정
                    </h3>
                </div>

                <div class="card-body">
                    <div th:if="${error}" class="alert alert-danger" role="alert">
                        <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span>
                    </div>

                    <form th:action="@{/board/{id}/edit/form(id=${board.id})}"
                          th:object="${boardRequest}"
                          method="post">
                        <input type="hidden" name="password" th:value="${password}">

                        <div class="mb-3">
                            <label for="title" class="form-label fw-bold">제목</label>
                            <input type="text"
                                   class="form-control"
                                   id="title"
                                   th:field="*{title}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">닉네임</label>
                            <input type="text"
                                   class="form-control"
                                   th:value="${board.nickname}"
                                   disabled>
                            <small class="text-muted">닉네임은 수정할 수 없습니다</small>
                        </div>

                        <div class="mb-3">
                            <label for="content" class="form-label fw-bold">내용</label>
                            <textarea class="form-control"
                                      id="content"
                                      th:field="*{content}"
                                      rows="15"></textarea>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/board/{id}(id=${board.id})}" class="btn btn-secondary btn-lg">
                                <i class="bi bi-x-circle"></i> 취소
                            </a>
                            <button type="submit" class="btn btn-warning btn-lg">
                                <i class="bi bi-check-circle"></i> 수정완료
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
