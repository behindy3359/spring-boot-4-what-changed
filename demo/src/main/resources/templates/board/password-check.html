<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 확인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body style="background-color: #f8f9fa;">
<nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
    <div class="container">
        <a class="navbar-brand" href="/board">
            <i class="bi bi-chat-dots-fill"></i> 익명 게시판
        </a>
    </div>
</nav>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-white text-center">
                    <h4 class="mb-0">
                        <i class="bi bi-lock"></i> 비밀번호 확인
                    </h4>
                </div>
                <div class="card-body">
                    <p class="text-center text-muted mb-4">
                        게시글을 수정하려면 비밀번호를 입력해주세요
                    </p>

                    <div th:if="${error}" class="alert alert-danger" role="alert">
                        <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span>
                    </div>

                    <form th:action="@{/board/{id}/edit/check(id=${boardId})}"
                          th:object="${passwordCheck}"
                          method="post">
                        <div class="mb-4">
                            <label for="password" class="form-label">비밀번호</label>
                            <input type="password"
                                   class="form-control form-control-lg"
                                   id="password"
                                   th:field="*{password}"
                                   placeholder="비밀번호를 입력하세요"
                                   autofocus
                                   required>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-check-circle"></i> 확인
                            </button>
                            <a th:href="@{/board/{id}(id=${boardId})}" class="btn btn-secondary btn-lg">
                                <i class="bi bi-x-circle"></i> 취소
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
